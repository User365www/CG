<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Лабораторная: CMYK - RGB - HSV</title>
    <style>
        body { font-family: sans-serif; background: #eef2f5; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; }
        .header-panel { display: flex; align-items: center; gap: 20px; background: white; padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; }
        #preview { width: 60px; height: 60px; border-radius: 6px; border: 2px solid #ccc; background: #ff0000; }
        .grid { display: flex; gap: 20px; }
        .card { flex: 1; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card h2 { margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 5px; }
        .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .row label { width: 25px; font-weight: bold; }
        .row input[type="range"] { flex: 1; margin: 0 10px; cursor: pointer; }
        .row input[type="number"] { width: 65px; padding: 4px; text-align: right; }
    </style>
</head>
<body>

<div class="container">
    <h1>Лабораторная работа: CMYK — RGB — HSV</h1>

    <div class="header-panel">
        <div id="preview"></div>
        <div>
            <div><strong>Цвет: <span id="hexLabel">#FF0000</span></strong></div>
            <label>Палитра: <input type="color" id="picker" value="#ff0000" oninput="fromPicker(this.value)"></label>
        </div>
    </div>

    <div class="grid">
        <!-- Блок CMYK -->
        <div class="card">
            <h2>CMYK (%)</h2>
            <div class="row"><label>C:</label><input type="range" id="c_r" min="0" max="100" step="0.1" oninput="send('cmyk', 'c', this.value)"><input type="number" id="c_n" min="0" max="100" step="0.1" oninput="send('cmyk', 'c', this.value)"></div>
            <div class="row"><label>M:</label><input type="range" id="m_r" min="0" max="100" step="0.1" oninput="send('cmyk', 'm', this.value)"><input type="number" id="m_n" min="0" max="100" step="0.1" oninput="send('cmyk', 'm', this.value)"></div>
            <div class="row"><label>Y:</label><input type="range" id="y_r" min="0" max="100" step="0.1" oninput="send('cmyk', 'y', this.value)"><input type="number" id="y_n" min="0" max="100" step="0.1" oninput="send('cmyk', 'y', this.value)"></div>
            <div class="row"><label>K:</label><input type="range" id="k_r" min="0" max="100" step="0.1" oninput="send('cmyk', 'k', this.value)"><input type="number" id="k_n" min="0" max="100" step="0.1" oninput="send('cmyk', 'k', this.value)"></div>
        </div>

        <!-- Блок RGB -->
        <div class="card">
            <h2>RGB (0-255)</h2>
            <div class="row"><label>R:</label><input type="range" id="r_r" min="0" max="255" oninput="send('rgb', 'r', this.value)"><input type="number" id="r_n" min="0" max="255" oninput="send('rgb', 'r', this.value)"></div>
            <div class="row"><label>G:</label><input type="range" id="g_r" min="0" max="255" oninput="send('rgb', 'g', this.value)"><input type="number" id="g_n" min="0" max="255" oninput="send('rgb', 'g', this.value)"></div>
            <div class="row"><label>B:</label><input type="range" id="b_r" min="0" max="255" oninput="send('rgb', 'b', this.value)"><input type="number" id="b_n" min="0" max="255" oninput="send('rgb', 'b', this.value)"></div>
        </div>

        <!-- Блок HSV -->
        <div class="card">
            <h2>HSV</h2>
            <div class="row"><label>H:</label><input type="range" id="h_r" min="0" max="360" step="0.1" oninput="send('hsv', 'h', this.value)"><input type="number" id="h_n" min="0" max="360" step="0.1" oninput="send('hsv', 'h', this.value)"></div>
            <div class="row"><label>S:</label><input type="range" id="s_r" min="0" max="100" step="0.1" oninput="send('hsv', 's', this.value)"><input type="number" id="s_n" min="0" max="100" step="0.1" oninput="send('hsv', 's', this.value)"></div>
            <div class="row"><label>V:</label><input type="range" id="v_r" min="0" max="100" step="0.1" oninput="send('hsv', 'v', this.value)"><input type="number" id="v_n" min="0" max="100" step="0.1" oninput="send('hsv', 'v', this.value)"></div>
        </div>
    </div>
</div>

<script>
    // Вся клиентская логика сведена в одну простую функцию отправки на Python
    async function send(model, param, val) {
        // Синхронизируем связанный ползунок и поле ввода
        document.getElementById(param + '_r').value = val;
        document.getElementById(param + '_n').value = val;

        // Собираем значения измененной модели
        let values = [];
        if (model === 'cmyk') values = ['c', 'm', 'y', 'k'].map(k => document.getElementById(k + '_n').value);
        if (model === 'rgb')  values = ['r', 'g', 'b'].map(k => document.getElementById(k + '_n').value);
        if (model === 'hsv')  values = ['h', 's', 'v'].map(k => document.getElementById(k + '_n').value);

        // Отправляем запрос на сервер Python
        let res = await fetch('/convert', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ model: model, values: values })
        });
        let data = await res.json();

        // Обновляем все значения в интерфейсе
        const setUI = (keys, arr) => keys.forEach((k, i) => {
            document.getElementById(k + '_r').value = arr[i];
            document.getElementById(k + '_n').value = arr[i];
        });

        if (model !== 'cmyk') setUI(['c', 'm', 'y', 'k'], data.cmyk);
        if (model !== 'rgb')  setUI(['r', 'g', 'b'], data.rgb);
        if (model !== 'hsv')  setUI(['h', 's', 'v'], data.hsv);

        // Обновляем плашку предпросмотра
        let hex = "#" + data.rgb.map(x => x.toString(16).padStart(2, '0')).join('');
        document.getElementById('preview').style.backgroundColor = hex;
        document.getElementById('hexLabel').innerText = hex.toUpperCase();
        document.getElementById('picker').value = hex;
    }

    // Обработка выбора из системной палитры
    function fromPicker(hex) {
        let r = parseInt(hex.slice(1, 3), 16),
            g = parseInt(hex.slice(3, 5), 16),
            b = parseInt(hex.slice(5, 7), 16);
        document.getElementById('r_n').value = r;
        document.getElementById('g_n').value = g;
        document.getElementById('b_n').value = b;
        send('rgb', 'r', r);
    }

    // Запуск при открытии (стартовый красный цвет)
    window.onload = () => send('rgb', 'r', 255);
</script>

</body>
</html>
